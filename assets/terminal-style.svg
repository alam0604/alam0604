
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#21152F"/>
      <stop offset=".55" stop-color="#30203F"/>
      <stop offset="1" stop-color="#171323"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#B98CF4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#D8B9FF"/>
      <stop offset="1" stop-color="#B98CF4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#76549A"/>
      <stop offset="1" stop-color="#49335F"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="590" rx="25" fill="url(#bg)"/>
  <rect x="2" y="2" width="1196" height="586" rx="23" fill="none" stroke="#9B75BD" stroke-opacity=".5"/>

  <!-- Subtle star field -->
  <g fill="#E9D5FF">
    <circle cx="80" cy="75" r="2"/><circle cx="175" cy="120" r="1.5"/>
    <circle cx="1090" cy="75" r="2"/><circle cx="1140" cy="160" r="1.5"/>
    <circle cx="1020" cy="220" r="1.5"/><circle cx="90" cy="480" r="2"/>
    <circle cx="1080" cy="485" r="2"/><circle cx="720" cy="75" r="1.5"/>
    <circle cx="520" cy="525" r="1.5"/><circle cx="310" cy="75" r="1.5"/>
  </g>
  <g stroke="#DCC1FF" stroke-width="1.5" opacity=".7">
    <path d="M1040 115 v14 M1033 122 h14"/>
    <path d="M145 390 v12 M139 396 h12"/>
    <path d="M1110 360 v14 M1103 367 h14"/>
    <path d="M890 90 v10 M885 95 h10"/>
  </g>

  <!-- Hero -->
  <text x="55" y="75" fill="#CDA9F5" font-family="monospace" font-size="15">✦ WELCOME TO MY Githuub viewer ✦</text>
  <text x="55" y="139" fill="#FFF2FF" font-family="sans-serif" font-size="43" font-weight="bold">hello, world! I'm Alam <tspan fill="#D2A9FF">✧</tspan></text>
  <text x="57" y="178" fill="#CBB9DA" font-family="sans-serif" font-size="18">Azure Data Engineer · Databricks enthusiast · curious by nature</text>

  <!-- Terminal prompt -->
  <rect x="55" y="218" width="1090" height="78" rx="14" fill="#171020" stroke="#8C65AC" stroke-opacity=".8"/>
  <rect x="55" y="218" width="1090" height="78" rx="14" fill="none" stroke="#B58BEA" stroke-opacity=".15" stroke-width="5" filter="url(#glow)"/>
  <text x="83" y="250" fill="#BDA0E8" font-family="monospace" font-size="16">alam@universe <tspan fill="#E5C8FF">~</tspan> <tspan fill="#9EE6B4">❯</tspan></text>
  <text x="83" y="277" fill="#F7EDFF" font-family="monospace" font-size="18">building scalable data pipelines, one spark at a time <tspan fill="#C99CFF">▍</tspan></text>

  <!-- Separator -->
  <rect x="55" y="322" width="1090" height="1.5" fill="url(#line)"/>

  <!-- Left: stack -->
  <text x="65" y="363" fill="#D9B7FF" font-family="monospace" font-size="16">❯ 01 / MY_STACK</text>
  <text x="65" y="392" fill="#AFA0BD" font-family="monospace" font-size="12">$ ls favorite_tools/</text>

  <g font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="65" y="412" width="120" height="37" rx="10" fill="url(#chip)"/>
    <text x="125" y="436" fill="#FFF">Azure</text>
    <rect x="198" y="412" width="145" height="37" rx="10" fill="url(#chip)"/>
    <text x="270" y="436" fill="#FFF">Databricks</text>
    <rect x="356" y="412" width="120" height="37" rx="10" fill="url(#chip)"/>
    <text x="416" y="436" fill="#FFF">PySpark</text>
    <rect x="65" y="462" width="120" height="37" rx="10" fill="url(#chip)"/>
    <text x="125" y="486" fill="#FFF">SQL</text>
    <rect x="198" y="462" width="145" height="37" rx="10" fill="url(#chip)"/>
    <text x="270" y="486" fill="#FFF">Delta Lake</text>
    <rect x="356" y="462" width="120" height="37" rx="10" fill="url(#chip)"/>
    <text x="416" y="486" fill="#FFF">ADF</text>
  </g>

  <!-- Vertical separator -->
  <path d="M550 350 V510" stroke="#76558F" stroke-dasharray="4 7"/>

  <!-- Right: profile -->
  <text x="600" y="363" fill="#D9B7FF" font-family="monospace" font-size="16">❯ 02 / ABOUT_ME</text>
  <text x="600" y="398" fill="#BDAACB" font-family="monospace" font-size="13">experience</text>
  <text x="800" y="398" fill="#F7EDFF" font-family="sans-serif" font-size="18" font-weight="bold">3.5+ years</text>
  <text x="600" y="434" fill="#BDAACB" font-family="monospace" font-size="13">speciality</text>
  <text x="800" y="434" fill="#E2C8FF" font-family="sans-serif" font-size="17">Azure Data Engineering</text>
  <text x="600" y="470" fill="#BDAACB" font-family="monospace" font-size="13">certifications</text>
  <text x="800" y="470" fill="#A9E6B6" font-family="sans-serif" font-size="14">✦ Databricks Associate</text>
  <text x="800" y="496" fill="#A9E6B6" font-family="sans-serif" font-size="14">✦ Databricks Professional</text>

  <!-- Footer -->
  <rect x="55" y="535" width="1090" height="1" fill="url(#line)"/>
  <text x="55" y="565" fill="#D8B9FA" font-family="monospace" font-size="13">❯ echo "stay curious, keep creating"</text>
  <text x="1145" y="565" text-anchor="end" fill="#C4A8D9" font-family="monospace" font-size="13">made with ♡ and a little patience and magic ✧</text>
</svg>
