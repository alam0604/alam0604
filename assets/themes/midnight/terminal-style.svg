
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#121A25"/>
      <stop offset=".55" stop-color="#192433"/>
      <stop offset="1" stop-color="#0E141D"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8CE2F4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#B9EBFF"/>
      <stop offset="1" stop-color="#8CE2F4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#30BEAE"/>
      <stop offset="1" stop-color="#1D755B"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="590" rx="25" fill="url(#bg)"/>
  <rect x="2" y="2" width="1196" height="586" rx="23" fill="none" stroke="#5CD4D6" stroke-opacity=".5"/>

  <!-- Subtle star field -->
  <g fill="#D5F1FF">
    <circle cx="80" cy="75" r="2"/><circle cx="175" cy="120" r="1.5"/>
    <circle cx="1090" cy="75" r="2"/><circle cx="1140" cy="160" r="1.5"/>
    <circle cx="1020" cy="220" r="1.5"/><circle cx="90" cy="480" r="2"/>
    <circle cx="1080" cy="485" r="2"/><circle cx="720" cy="75" r="1.5"/>
    <circle cx="520" cy="525" r="1.5"/><circle cx="310" cy="75" r="1.5"/>
  </g>
  <g stroke="#C1EDFF" stroke-width="1.5" opacity=".7">
    <path d="M1040 115 v14 M1033 122 h14"/>
    <path d="M145 390 v12 M139 396 h12"/>
    <path d="M1110 360 v14 M1103 367 h14"/>
    <path d="M890 90 v10 M885 95 h10"/>
  </g>

  <!-- Hero -->
  <text x="55" y="75" fill="#A9E4F5" font-family="monospace" font-size="15">✦ WELCOME to my github ✦</text>
  <text x="55" y="139" fill="#F2FAFF" font-family="sans-serif" font-size="43" font-weight="bold">hello, world! I'm Alam <tspan fill="#A9EAFF">✧</tspan></text>
  <text x="57" y="178" fill="#A9DCEA" font-family="sans-serif" font-size="18">Azure Data Engineer · Databricks enthusiast · curious by nature</text>

  <!-- Terminal prompt -->
  <rect x="55" y="218" width="1090" height="78" rx="14" fill="#0C121A" stroke="#41D0C9" stroke-opacity=".8"/>
  <rect x="55" y="218" width="1090" height="78" rx="14" fill="none" stroke="#8BDCEA" stroke-opacity=".15" stroke-width="5" filter="url(#glow)"/>
  <text x="83" y="250" fill="#A0DBE8" font-family="monospace" font-size="16">alam@universe <tspan fill="#C8EEFF">~</tspan> <tspan fill="#9EE6B4">❯</tspan></text>
  <text x="83" y="277" fill="#EDF8FF" font-family="monospace" font-size="18">building scalable data pipelines, one spark at a time <tspan fill="#9CE9FF">▍</tspan></text>

  <!-- Separator -->
  <rect x="55" y="322" width="1090" height="1.5" fill="url(#line)"/>

  <!-- Left: stack -->
  <text x="65" y="363" fill="#B7EBFF" font-family="monospace" font-size="16">❯ 01 / MY_STACK</text>
  <text x="65" y="392" fill="#7ED5DF" font-family="monospace" font-size="12">$ ls favorite_tools/</text>

  <g font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="65" y="412" width="120" height="37" rx="10" fill="url(#chip)"/>
    <text x="125" y="436" fill="#FFFFFF">Azure</text>
    <rect x="198" y="412" width="145" height="37" rx="10" fill="url(#chip)"/>
    <text x="270" y="436" fill="#FFFFFF">Databricks</text>
    <rect x="356" y="412" width="120" height="37" rx="10" fill="url(#chip)"/>
    <text x="416" y="436" fill="#FFFFFF">PySpark</text>
    <rect x="65" y="462" width="120" height="37" rx="10" fill="url(#chip)"/>
    <text x="125" y="486" fill="#FFFFFF">SQL</text>
    <rect x="198" y="462" width="145" height="37" rx="10" fill="url(#chip)"/>
    <text x="270" y="486" fill="#FFFFFF">Delta Lake</text>
    <rect x="356" y="462" width="120" height="37" rx="10" fill="url(#chip)"/>
    <text x="416" y="486" fill="#FFFFFF">ADF</text>
  </g>

  <!-- Vertical separator -->
  <path d="M550 350 V510" stroke="#2EB6A4" stroke-dasharray="4 7"/>

  <!-- Right: profile -->
  <text x="600" y="363" fill="#B7EBFF" font-family="monospace" font-size="16">❯ 02 / ABOUT_ME</text>
  <text x="600" y="398" fill="#91D7E4" font-family="monospace" font-size="13">experience</text>
  <text x="800" y="398" fill="#EDF8FF" font-family="sans-serif" font-size="18" font-weight="bold">3.5+ years</text>
  <text x="600" y="434" fill="#91D7E4" font-family="monospace" font-size="13">speciality</text>
  <text x="800" y="434" fill="#C8EEFF" font-family="sans-serif" font-size="17">Azure Data Engineering</text>
  <text x="600" y="470" fill="#91D7E4" font-family="monospace" font-size="13">certifications</text>
  <text x="800" y="470" fill="#A9E6B6" font-family="sans-serif" font-size="14">✦ Databricks Associate</text>
  <text x="800" y="496" fill="#A9E6B6" font-family="sans-serif" font-size="14">✦ Databricks Professional</text>

  <!-- Footer -->
  <rect x="55" y="535" width="1090" height="1" fill="url(#line)"/>
  <text x="55" y="565" fill="#B9E8FA" font-family="monospace" font-size="13">❯ echo "stay curious, keep creating"</text>
  <text x="1145" y="565" text-anchor="end" fill="#9BD9E6" font-family="monospace" font-size="13">made with ♡ and a little patience and magic ✧</text>
</svg>
