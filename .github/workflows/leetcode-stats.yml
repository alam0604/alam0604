name: Update LeetCode card + themes

on:
  schedule:
    - cron: "30 0 * * *"   # every day, 06:00 IST
  workflow_dispatch:        # "Run workflow" button for manual updates
  push:                     # rebuild the themes whenever the README or art changes
    branches: [main]
    paths:
      - "profile-source.md"
      - "assets/*.svg"
      - "scripts/**"
      - ".github/workflows/leetcode-stats.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Redraw the card
        if: github.event_name != 'push'
        env:
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
        run: python scripts/leetcode_card.py

      - name: Rebuild the themes
        run: python scripts/build_themes.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md profile-source.md
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update LeetCode card and themes"
            git push
          fi
